# Configuration reference: https://golangci-lint.run/docs/configuration/
# Requires golangci-lint v2.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - dogsled
    - durationcheck
    - errorlint
    - exhaustive
    - gocritic
    - gocyclo
    - godot
    - gosec
    - lll
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - revive
    - testpackage
    - unconvert
    - unparam
    - wastedassign
    - whitespace
  settings:
    errcheck:
      # SDKv2 d.Get(...).(T) assertions are guaranteed by the schema.
      check-type-assertions: false
    errorlint:
      errorf: false
    exhaustive:
      default-signifies-exhaustive: true
    gocyclo:
      min-complexity: 15
    govet:
      enable-all: true
      disable:
        - fieldalignment # reordering struct fields hurts readability
    lll:
      line-length: 140
    nakedret:
      max-func-lines: 5
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Table-driven and fixture-heavy tests are allowed to be long and repetitive.
      - path: _test\.go
        linters:
          - lll
          - gocyclo
      # Internal (white-box) tests live in the same package on purpose.
      - path: _internal_test\.go
        linters:
          - testpackage

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kentik/terraform-provider-kentik-cloudexport
